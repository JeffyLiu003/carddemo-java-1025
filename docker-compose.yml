name: carddemo

services:
  postgres:
    image: postgres:16-alpine
    container_name: carddemo-postgres
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: carddemo
      POSTGRES_PASSWORD: carddemo
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - carddemo-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carddemo -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  iam-service:
    build:
      context: ./services/iam-service
    container_name: carddemo-iam
    environment:
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carddemo_iam
      DB_USER: carddemo
      DB_PASSWORD: carddemo
      IAM_TOKEN_SECRET: ${IAM_TOKEN_SECRET:-carddemo-demo-secret-change-me}
      IAM_TOKEN_TTL_SECONDS: 3600
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  customer-service:
    build:
      context: ./services/customer-service
    container_name: carddemo-customer
    environment:
      SERVER_PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carddemo_customer
      DB_USER: carddemo
      DB_PASSWORD: carddemo
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  card-service:
    build:
      context: ./services/card-service
    container_name: carddemo-card
    environment:
      SERVER_PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carddemo_card
      DB_USER: carddemo
      DB_PASSWORD: carddemo
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  account-service:
    build:
      context: ./services/account-service
    container_name: carddemo-account
    environment:
      SERVER_PORT: 8084
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carddemo_account
      DB_USER: carddemo
      DB_PASSWORD: carddemo
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

  transaction-service:
    build:
      context: ./services/transaction-service
    container_name: carddemo-transaction
    environment:
      SERVER_PORT: 8085
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carddemo_transaction
      DB_USER: carddemo
      DB_PASSWORD: carddemo
      CARD_SERVICE_URL: http://card-service:8083
      ACCOUNT_SERVICE_URL: http://account-service:8084
      LEDGER_SERVICE_URL: http://ledger-service:8088
      LEDGER_SYNC_ENABLED: "true"
      MARKETING_SERVICE_URL: http://marketing-service:8087
      MARKETING_ENABLED: "true"
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      card-service:
        condition: service_started
      account-service:
        condition: service_started
      ledger-service:
        condition: service_started
      marketing-service:
        condition: service_started

  ledger-service:
    build:
      context: ./services/ledger-service
    container_name: carddemo-ledger
    environment:
      SERVER_PORT: 8088
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carddemo_ledger
      DB_USER: carddemo
      DB_PASSWORD: carddemo
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy

  reconciliation-service:

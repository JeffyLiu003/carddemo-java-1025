      context: ./services/reconciliation-service
    container_name: carddemo-reconciliation
    environment:
      SERVER_PORT: 8089
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carddemo_reconciliation
      DB_USER: carddemo
      DB_PASSWORD: carddemo
      TRANSACTION_SERVICE_URL: http://transaction-service:8085
      LEDGER_SERVICE_URL: http://ledger-service:8088
